<div class="chatbot-wrapper">

    <section
      class="chat-window"
      [class.chat-window-open]="isChatOpen"
      [attr.aria-hidden]="!isChatOpen"
    >
  
      <header class="chat-header">
  
        <div class="assistant-information">
  
          <div class="assistant-avatar">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 2a2 2 0 0 1 2 2v1h2a4 4 0 0 1 4 4v7a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V9a4 4 0 0 1 4-4h2V4a2 2 0 0 1 2-2Zm-4 7a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm8 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm-8 6a1 1 0 0 0 0 2h8a1 1 0 1 0 0-2H8Z"
              ></path>
            </svg>
  
            <span class="online-indicator"></span>
          </div>
  
          <div class="assistant-details">
            <h2>DriveU Assistant</h2>
  
            <div class="assistant-status">
              <span class="status-dot"></span>
              <span>Online</span>
            </div>
          </div>
  
        </div>
  
        <div class="header-actions">
  
          <button
            type="button"
            class="header-button"
            aria-label="Clear chat"
            title="Clear chat"
            [disabled]="isLoading"
            (click)="clearChat()"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M9 3h6l1 2h4v2h-1l-1 13H6L5 7H4V5h4l1-2Zm-1.99 4 .85 11h8.28l.85-11H7.01ZM9 9h2v7H9V9Zm4 0h2v7h-2V9Z"
              ></path>
            </svg>
          </button>
  
          <button
            type="button"
            class="header-button"
            aria-label="Close chatbot"
            title="Close chatbot"
            (click)="closeChat()"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M18.3 5.7a1 1 0 0 0-1.4 0L12 10.6 7.1 5.7a1 1 0 0 0-1.4 1.4l4.9 4.9-4.9 4.9a1 1 0 1 0 1.4 1.4l4.9-4.9 4.9 4.9a1 1 0 0 0 1.4-1.4L13.4 12l4.9-4.9a1 1 0 0 0 0-1.4Z"
              ></path>
            </svg>
          </button>
  
        </div>
  
      </header>
  
      <div
        class="chat-messages"
        #messagesContainer
      >
  
        <div class="welcome-section">
  
          <div class="welcome-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 2a2 2 0 0 1 2 2v1h2a4 4 0 0 1 4 4v7a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V9a4 4 0 0 1 4-4h2V4a2 2 0 0 1 2-2Zm-4 7a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm8 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm-8 6a1 1 0 0 0 0 2h8a1 1 0 1 0 0-2H8Z"
              ></path>
            </svg>
          </div>
  
          <h3>Welcome to DriveU</h3>
          <p>Your AI assistant for DriveU project questions.</p>
  
        </div>
  
        <div class="message-list">
  
          <ng-template
            ngFor
            let-message
            [ngForOf]="messages"
          >
  
            <div
              class="message-row"
              [class.user-message-row]="message.sender === 'user'"
              [class.bot-message-row]="message.sender === 'bot'"
            >
  
              <ng-template [ngIf]="message.sender === 'bot'">
                <div class="message-avatar bot-avatar">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M12 2a2 2 0 0 1 2 2v1h2a4 4 0 0 1 4 4v7a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V9a4 4 0 0 1 4-4h2V4a2 2 0 0 1 2-2Zm-4 7a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm8 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm-8 6a1 1 0 0 0 0 2h8a1 1 0 1 0 0-2H8Z"
                    ></path>
                  </svg>
                </div>
              </ng-template>
  
              <div class="message-content">
  
                <div
                  class="message-bubble"
                  [class.bot-message]="message.sender === 'bot'"
                  [class.user-message]="message.sender === 'user'"
                >
                  {{ message.text }}
                </div>
  
                <span class="message-time">
                  {{ message.time }}
                </span>
  
              </div>
  
              <ng-template [ngIf]="message.sender === 'user'">
                <div class="message-avatar user-avatar">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5C21 16.5 17 14 12 14Z"
                    ></path>
                  </svg>
                </div>
              </ng-template>
  
            </div>
  
          </ng-template>
  
          <ng-template [ngIf]="isLoading">
  
            <div class="message-row bot-message-row">
  
              <div class="message-avatar bot-avatar">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M12 2a2 2 0 0 1 2 2v1h2a4 4 0 0 1 4 4v7a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V9a4 4 0 0 1 4-4h2V4a2 2 0 0 1 2-2Zm-4 7a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm8 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm-8 6a1 1 0 0 0 0 2h8a1 1 0 1 0 0-2H8Z"
                  ></path>
                </svg>
              </div>
  
              <div class="message-content">
                <div class="message-bubble bot-message typing-message">
                  <span class="typing-dot"></span>
                  <span class="typing-dot"></span>
                  <span class="typing-dot"></span>
                </div>
              </div>
  
            </div>
  
          </ng-template>
  
        </div>
  
        <ng-template [ngIf]="messages.length === 1 && !isLoading">
  
          <div class="suggested-question-section">
  
            <p>Try asking:</p>
  
            <ng-template
              ngFor
              let-question
              [ngForOf]="suggestedQuestions"
            >
              <button
                type="button"
                class="suggested-question"
                (click)="sendSuggestedQuestion(question)"
              >
                {{ question }}
              </button>
            </ng-template>
  
          </div>
  
        </ng-template>
  
      </div>
  
      <footer class="chat-footer">
  
        <div class="message-input-container">
  
          <textarea
            class="message-input"
            rows="1"
            maxlength="500"
            placeholder="Ask about DriveU..."
            aria-label="Ask a question about DriveU"
            [value]="userMessage"
            [disabled]="isLoading"
            (input)="updateMessage($event)"
            (keydown)="handleKeyDown($event)"
          ></textarea>
  
          <button
            type="button"
            class="send-button"
            aria-label="Send message"
            title="Send message"
            [disabled]="!userMessage.trim() || isLoading"
            (click)="sendMessage()"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M3.4 20.4 22 12 3.4 3.6 3 10l13 2-13 2 .4 6.4Z"
              ></path>
            </svg>
          </button>
  
        </div>
  
        <p class="footer-note">
          DriveU AI Assistant
        </p>
  
      </footer>
  
    </section>
  
    <button
      type="button"
      class="chat-toggle-button"
      [class.chat-toggle-active]="isChatOpen"
      [attr.aria-label]="isChatOpen ? 'Close DriveU assistant' : 'Open DriveU assistant'"
      (click)="toggleChat()"
    >
  
      <ng-template [ngIf]="!isChatOpen">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 2a10 10 0 0 0-8.54 15.2L2 22l4.8-1.46A10 10 0 1 0 12 2Zm-4 9h8a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2Zm0-4h8a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2Zm0 8h5a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2Z"
          ></path>
        </svg>
      </ng-template>
  
      <ng-template [ngIf]="isChatOpen">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M18.3 5.7a1 1 0 0 0-1.4 0L12 10.6 7.1 5.7a1 1 0 0 0-1.4 1.4l4.9 4.9-4.9 4.9a1 1 0 1 0 1.4 1.4l4.9-4.9 4.9 4.9a1 1 0 0 0 1.4-1.4L13.4 12l4.9-4.9a1 1 0 0 0 0-1.4Z"
          ></path>
        </svg>
      </ng-template>
  
      <ng-template [ngIf]="!isChatOpen">
        <span class="notification-dot"></span>
      </ng-template>
  
    </button>
  
  </div>
