<div
  [ngClass]="isDarkMode
    ? 'bg-[#050505] text-slate-200'
    : 'bg-[#e7e3dc] text-[#25231f]'"
  class="feedback-page w-full h-full overflow-y-auto flex flex-col font-sans p-6 md:px-10 md:py-8 relative box-border pointer-events-auto transition-colors duration-500"
>

  <!-- ================= HEADER ================= -->

  <div
    [ngClass]="isDarkMode
      ? 'border-white/5'
      : 'border-[#cec7bd]'"
    class="feedback-header flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8 shrink-0 w-full border-b pb-6"
  >

    <div class="flex items-center gap-4">

      <div
        [ngClass]="isDarkMode
          ? 'bg-gradient-to-br from-red-500/20 to-orange-500/10 text-red-500 shadow-[0_0_15px_rgba(239,68,68,0.15)] border-red-500/20'
          : 'bg-gradient-to-br from-[#a9420c] via-[#c95812] to-[#dc7a39] text-white shadow-[0_8px_18px_rgba(169,66,12,0.30)] border-[#c95812]'"
        class="p-2.5 rounded-xl border"
      >
        <svg
          class="w-6 h-6 md:w-7 md:h-7"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"
          ></path>
        </svg>
      </div>

      <div>

        <h3 class="text-2xl md:text-3xl font-extrabold tracking-tight drop-shadow-md">

          <span
            [ngClass]="isDarkMode
              ? 'text-white'
              : 'text-[#25231f]'"
          >
            Write
          </span>

          <span
            [ngClass]="isDarkMode
              ? 'from-red-500 to-orange-400'
              : 'from-[#a9420c] via-[#c95812] to-[#dc7a39]'"
            class="bg-gradient-to-r bg-clip-text text-transparent ml-1"
          >
            Review
          </span>

        </h3>

        <p
          [ngClass]="isDarkMode
            ? 'text-slate-400'
            : 'text-[#686158]'"
          class="text-xs font-medium mt-1 tracking-wide"
        >
          Rate your experience with the driver
        </p>

      </div>
    </div>

    <!-- Back to Requests Button -->

    <button
      type="button"
      (click)="goBack()"
      [ngClass]="isDarkMode
        ? 'bg-slate-800/40 hover:bg-red-500/10 text-slate-300 hover:text-red-400 border-slate-700 hover:border-red-500/30'
        : 'bg-[#f0ece5] hover:bg-[#f1dccb] text-[#686158] hover:text-[#a9420c] border-[#cec7bd] hover:border-[#c95812]'"
      class="group flex items-center gap-2 px-5 py-2.5 text-xs font-bold uppercase tracking-widest rounded-xl transition-all duration-300 border shadow-lg cursor-pointer"
    >
      <svg
        class="w-4 h-4 group-hover:-translate-x-1 transition-transform"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M15 19l-7-7 7-7"
        ></path>
      </svg>

      Back to Requests
    </button>

  </div>

  <!-- ================= FORM CONTAINER ================= -->

  <div class="feedback-form-wrapper w-full flex justify-center items-start">

    <div
      [ngClass]="isDarkMode
        ? 'bg-[#13151a]/90 border-white/10'
        : 'bg-[#f0ece5]/95 border-[#cec7bd]'"
      class="feedback-card w-full max-w-2xl backdrop-blur-xl border rounded-3xl p-6 md:p-10 shadow-[0_8px_30px_rgb(0,0,0,0.20)] relative transition-colors duration-500"
    >

      <form
        #feedbackForm="ngForm"
        (ngSubmit)="submitFeedback(feedbackForm)"
        class="feedback-scroll-area space-y-6"
      >

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

          <!-- Category -->

          <div>

            <label
              [ngClass]="isDarkMode
                ? 'text-slate-400'
                : 'text-[#686158]'"
              class="block text-[10px] uppercase font-bold mb-2 tracking-widest"
            >
              Category

              <span
                [ngClass]="isDarkMode
                  ? 'text-red-500'
                  : 'text-[#a9420c]'"
              >
                *
              </span>
            </label>

            <div class="relative group">

              <select
                name="category"
                [(ngModel)]="feedback.category"
                required
                #category="ngModel"
                [ngClass]="isDarkMode
                  ? 'bg-black/50 border-white/10 text-slate-200 focus:border-orange-500/50 hover:bg-black/70'
                  : 'bg-[#e7e3dc] border-[#cec7bd] text-[#25231f] focus:border-[#c95812] hover:bg-[#e1dbd2]'"
                class="custom-select w-full pl-4 pr-11 py-3.5 border rounded-xl text-sm font-medium focus:outline-none transition-all shadow-inner appearance-none cursor-pointer"
              >
                <option value="" disabled>
                  Select Category
                </option>

                <option value="Driver Performance">
                  Driver Performance
                </option>

                <option value="Service Experience">
                  Service Experience
                </option>
              </select>

              <div
                [ngClass]="isDarkMode
                  ? 'text-orange-400 group-hover:text-orange-300'
                  : 'text-[#c95812] group-hover:text-[#a9420c]'"
                class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 transition-colors"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2.5"
                    d="M19 9l-7 7-7-7"
                  ></path>
                </svg>
              </div>

            </div>

            <p
              *ngIf="category.invalid && category.touched"
              [ngClass]="isDarkMode
                ? 'text-red-400'
                : 'text-[#a9420c]'"
              class="mt-1 text-[10px] font-semibold"
            >
              Please select a category.
            </p>

          </div>

          <!-- Rating -->

          <div>

            <label
              [ngClass]="isDarkMode
                ? 'text-slate-400'
                : 'text-[#686158]'"
              class="block text-[10px] uppercase font-bold mb-2 tracking-widest"
            >
              Rating

              <span
                [ngClass]="isDarkMode
                  ? 'text-red-500'
                  : 'text-[#a9420c]'"
              >
                *
              </span>
            </label>

            <div class="relative group">

              <select
                name="rating"
                [(ngModel)]="feedback.rating"
                required
                #rating="ngModel"
                [ngClass]="isDarkMode
                  ? 'bg-black/50 border-white/10 text-slate-200 focus:border-orange-500/50 hover:bg-black/70'
                  : 'bg-[#e7e3dc] border-[#cec7bd] text-[#25231f] focus:border-[#c95812] hover:bg-[#e1dbd2]'"
                class="custom-select w-full pl-4 pr-11 py-3.5 border rounded-xl text-sm font-medium focus:outline-none transition-all shadow-inner appearance-none cursor-pointer"
              >
                <option value="" disabled>
                  Select Rating (1-5)
                </option>

                <option value="5">
                  ⭐⭐⭐⭐⭐ (5 - Excellent)
                </option>

                <option value="4">
                  ⭐⭐⭐⭐ (4 - Good)
                </option>

                <option value="3">
                  ⭐⭐⭐ (3 - Average)
                </option>

                <option value="2">
                  ⭐⭐ (2 - Poor)
                </option>

                <option value="1">
                  ⭐ (1 - Terrible)
                </option>
              </select>

              <div
                [ngClass]="isDarkMode
                  ? 'text-orange-400 group-hover:text-orange-300'
                  : 'text-[#c95812] group-hover:text-[#a9420c]'"
                class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 transition-colors"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2.5"
                    d="M19 9l-7 7-7-7"
                  ></path>
                </svg>
              </div>

            </div>

            <p
              *ngIf="rating.invalid && rating.touched"
              [ngClass]="isDarkMode
                ? 'text-red-400'
                : 'text-[#a9420c]'"
              class="mt-1 text-[10px] font-semibold"
            >
              Please select a rating.
            </p>

          </div>
        </div>

        <!-- Comment -->

        <div>

          <label
            [ngClass]="isDarkMode
              ? 'text-slate-400'
              : 'text-[#686158]'"
            class="block text-[10px] uppercase font-bold mb-2 tracking-widest"
          >
            Feedback Details

            <span
              [ngClass]="isDarkMode
                ? 'text-red-500'
                : 'text-[#a9420c]'"
            >
              *
            </span>
          </label>

          <textarea
            rows="4"
            name="feedbackText"
            [(ngModel)]="feedback.feedbackText"
            required
            #feedbackText="ngModel"
            placeholder="Tell us about your trip experience..."
            [ngClass]="isDarkMode
              ? 'bg-black/50 border-white/10 text-slate-200 placeholder-slate-600 focus:border-orange-500/50 hover:bg-black/70'
              : 'bg-[#e7e3dc] border-[#cec7bd] text-[#25231f] placeholder-[#82796e] focus:border-[#c95812] hover:bg-[#e1dbd2]'"
            class="w-full px-4 py-3.5 border rounded-xl text-sm font-medium focus:outline-none transition-all shadow-inner resize-none custom-scrollbar"
          ></textarea>

          <p
            *ngIf="feedbackText.invalid && feedbackText.touched"
            [ngClass]="isDarkMode
              ? 'text-red-400'
              : 'text-[#a9420c]'"
            class="mt-1 text-[10px] font-semibold"
          >
            Feedback details are required.
          </p>

        </div>

        <!-- Action Button -->

        <div
          [ngClass]="isDarkMode
            ? 'border-white/5'
            : 'border-[#cec7bd]'"
          class="pt-6 mt-4 flex justify-end border-t"
        >

          <button
            type="submit"
            [disabled]="feedbackForm.invalid"
            [ngClass]="isDarkMode
              ? 'from-red-600 to-orange-500 shadow-[0_0_20px_-5px_rgba(239,68,68,0.5)]'
              : 'from-[#a9420c] via-[#c95812] to-[#dc7a39] shadow-[0_10px_25px_rgba(169,66,12,0.30)]'"
            class="w-full sm:w-auto px-12 py-3.5 bg-gradient-to-r text-white text-[11px] font-extrabold uppercase tracking-widest rounded-xl transition-all hover:-translate-y-1 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0 disabled:shadow-none"
          >
            Submit Review
          </button>

        </div>

      </form>
    </div>
  </div>
</div>

<!-- ================= SUCCESS CONFIRMATION BOX ================= -->

<div
  *ngIf="showSuccessBox"
  [ngClass]="isDarkMode
    ? 'bg-black/60'
    : 'bg-[#25231f]/55'"
  class="fixed inset-0 z-[9999] flex items-center justify-center backdrop-blur-sm px-4"
>

  <div
    [ngClass]="isDarkMode
      ? 'bg-[#13151a] border-white/10 text-slate-200'
      : 'bg-[#f0ece5] border-[#cec7bd] text-[#25231f]'"
    class="w-full max-w-sm rounded-2xl border shadow-2xl p-6 text-center animate-scale-in"
  >

    <div
      [ngClass]="isDarkMode
        ? 'bg-red-500/15 text-red-400 border-red-500/30'
        : 'bg-[#f1dccb] text-[#c95812] border-[#c95812]/40'"
      class="w-14 h-14 mx-auto rounded-full flex items-center justify-center border mb-4"
    >
      <svg
        class="w-8 h-8"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
        ></path>
      </svg>
    </div>

    <h3
      [ngClass]="isDarkMode
        ? 'text-white'
        : 'text-[#25231f]'"
      class="text-xl font-extrabold mb-2"
    >
      Review Submitted
    </h3>

    <p
      [ngClass]="isDarkMode
        ? 'text-slate-400'
        : 'text-[#686158]'"
      class="text-sm font-medium leading-relaxed mb-5"
    >
      {{ successMessage }}
    </p>

    <button
      type="button"
      (click)="closeSuccessBox()"
      [ngClass]="isDarkMode
        ? 'from-red-600 to-orange-500 shadow-[0_0_20px_-5px_rgba(239,68,68,0.5)]'
        : 'from-[#a9420c] via-[#c95812] to-[#dc7a39] shadow-[0_10px_25px_rgba(169,66,12,0.30)]'"
      class="w-full px-6 py-2.5 rounded-lg bg-gradient-to-r text-white text-xs font-extrabold uppercase tracking-widest hover:-translate-y-0.5 transition-all"
    >
      OK, View Feedback
    </button>

  </div>
</div>
