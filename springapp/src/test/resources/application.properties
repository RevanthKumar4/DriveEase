# ============================================================
# DriveEase — Test Configuration (uses H2 in-memory DB)
# ============================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway for tests (H2 schema is created by Hibernate)
spring.flyway.enabled=false

# JWT — use a test-specific secret
jwt.secret=DriveEaseTestSecretKeyThatIs32BytesLong!
jwt.expiration-ms=3600000

# Disable mail for tests (tests mock the mail sender)
spring.mail.host=localhost
spring.mail.port=25

# Gemini — empty for tests (service is mocked)
gemini.api.key=test-key
gemini.api.url=http://localhost/test

# Razorpay — empty for tests
razorpay.key.id=test-key-id
razorpay.key.secret=test-secret

# CORS — not relevant for tests
cors.allowed-origins=http://localhost:4200

# Suppress actuator in tests
management.endpoints.web.exposure.include=health
