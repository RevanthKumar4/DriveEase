# ============================================================
# DriveEase — Application Configuration
# ============================================================
# All sensitive values are read from environment variables.
# Copy .env.example to .env and fill in the values for local dev.
# NEVER hardcode real credentials here.
# ============================================================

# --- Active Profile ---
# Override with: -Dspring.profiles.active=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Server ---
server.port=${PORT:${SERVER_PORT:8080}}
server.forward-headers-strategy=framework

# --- Database ---
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost/appdb?createDatabaseIfNotExist=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# --- Flyway ---
# baseline-on-migrate=true allows Flyway to work with existing (non-empty) databases
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# --- JWT ---
jwt.secret=${JWT_SECRET:DriveEaseDefaultDevSecretKeyMustBeAtLeast32BytesLong!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Mail (Gmail SMTP via SSL Port 465) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:revanthh006@gmail.com}
spring.mail.password=${MAIL_PASSWORD:crykrhcftcmfjdjs}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# --- Gemini AI ---
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-lite:generateContent}

# --- Razorpay ---
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# --- CORS ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081}

# --- OpenAPI / Swagger ---
springdoc.swagger-ui.disable-swagger-default-url=true
spring.mvc.pathmatch.matching-strategy=ant-path-matcher

# --- Actuator (health check) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=false
management.info.app.name=DriveEase