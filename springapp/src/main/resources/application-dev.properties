spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Disable secure cookies in dev (HTTP localhost)
# (cookie is still HttpOnly; secure flag only disabled for local HTTP)
server.servlet.session.cookie.secure=false
