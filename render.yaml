# ============================================================
# DriveEase — Render.com Deployment Blueprint
# ============================================================
# Deploy at: https://dashboard.render.com/select-repo
# Select this repo and Render will read this file automatically.
# ============================================================

services:
  - type: web
    name: driveease-backend
    runtime: java
    region: singapore   # closest free region to India
    plan: free

    # Build from the springapp subdirectory
    rootDir: springapp
    buildCommand: ./mvnw clean package -DskipTests --no-transfer-progress
    startCommand: java -Djava.security.egd=file:/dev/./urandom -jar target/springapp-0.0.1-SNAPSHOT.jar

    # Health check — Render uses this to know the service is up
    healthCheckPath: /actuator/health

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      - key: SERVER_PORT
        value: "8080"

      # ⚠️  Fill in the values below in the Render dashboard
      # or set them as environment variables in Render

      - key: DATABASE_URL
        sync: false   # set manually in Render dashboard

      - key: DATABASE_USERNAME
        sync: false

      - key: DATABASE_PASSWORD
        sync: false

      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a secure random value

      - key: JWT_EXPIRATION_MS
        value: "86400000"

      - key: MAIL_USERNAME
        sync: false

      - key: MAIL_PASSWORD
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        sync: false   # set to your Vercel URL, e.g. https://driveease.vercel.app

      - key: FLYWAY_ENABLED
        value: "false"

      - key: JPA_DDL_AUTO
        value: update
