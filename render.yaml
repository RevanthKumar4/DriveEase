# ============================================================
# DriveEase — Render.com Deployment Blueprint
# ============================================================

services:
  - type: web
    name: driveease-backend
    runtime: docker
    region: singapore
    plan: free

    # Path to Dockerfile
    dockerfilePath: ./springapp/Dockerfile
    dockerContext: ./springapp

    # Health check
    healthCheckPath: /actuator/health

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      - key: SERVER_PORT
        value: "8080"

      - key: DATABASE_URL
        sync: false

      - key: DATABASE_USERNAME
        sync: false

      - key: DATABASE_PASSWORD
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRATION_MS
        value: "86400000"

      - key: MAIL_USERNAME
        sync: false

      - key: MAIL_PASSWORD
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        value: "*"

      - key: FLYWAY_ENABLED
        value: "false"

      - key: JPA_DDL_AUTO
        value: update
